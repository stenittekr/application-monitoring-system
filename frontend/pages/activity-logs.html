<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Activity Logs - Centralized Server & Application Monitoring Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body data-page-title="Activity Logs">
<div id="amns-page-content">
    <div class="card border-0 shadow-sm mb-3">
        <div class="card-body">
            <div class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small text-muted">Entity Type</label>
                    <select class="form-select form-select-sm" id="filter-entity-type">
                        <option value="">All</option>
                        <option value="Application">Application</option>
                        <option value="Server">Server</option>
                        <option value="Incident">Incident</option>
                        <option value="User">User</option>
                        <option value="MaintenanceWindow">MaintenanceWindow</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label small text-muted">Action</label>
                    <input type="text" class="form-control form-control-sm" id="filter-action" placeholder="e.g. INCIDENT_ACKNOWLEDGED">
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted">From</label>
                    <input type="date" class="form-control form-control-sm" id="filter-date-from">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-sm btn-primary w-100" id="apply-filters-btn">Filter</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white fw-semibold"><i class="bi bi-journal-text me-2"></i>Activity Log</div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr><th>Timestamp</th><th>User</th><th>Action</th><th>Entity</th><th>Description</th><th>IP</th></tr>
                </thead>
                <tbody id="logs-table-body"><tr><td colspan="6" class="text-center text-muted py-4">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/activity-logs.js"></script>
</body>
</html>

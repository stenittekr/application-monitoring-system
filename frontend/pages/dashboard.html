<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard - Centralized Server & Application Monitoring Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body data-page-title="Dashboard">
<div id="amns-page-content">
    <div class="card border-0 shadow-sm mb-4" id="welcome-banner">
        <div class="card-body"></div>
    </div>
    <div class="row g-3 mb-4" id="stat-cards"></div>

    <div class="card border-0 shadow-sm mb-4" id="dashboard-filters">
        <div class="card-body py-2 d-flex flex-wrap align-items-center gap-2">
            <span class="small text-muted me-1"><i class="bi bi-funnel"></i> Filter</span>
            <select class="form-select form-select-sm w-auto" id="filter-status"></select>
            <select class="form-select form-select-sm w-auto" id="filter-environment"></select>
            <select class="form-select form-select-sm w-auto" id="filter-server"></select>
            <select class="form-select form-select-sm w-auto" id="filter-criticality"></select>
            <select class="form-select form-select-sm w-auto" id="filter-site"></select>
            <select class="form-select form-select-sm w-auto" id="filter-owner"></select>
            <select class="form-select form-select-sm w-auto" id="filter-tag"></select>
            <button class="btn btn-sm btn-outline-secondary d-none" id="filter-clear">Clear</button>
            <span class="small text-muted ms-auto" id="filter-count"></span>
        </div>
    </div>

    <div class="row g-3 mb-4" id="app-tiles"></div>

    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <span class="fw-semibold"><i class="bi bi-hdd-network me-2"></i>Applications</span>
            <div class="d-flex gap-2">
                <a class="btn btn-sm btn-outline-secondary" href="wallboard.html" target="_blank" rel="noopener" title="Open a clean, auto-refreshing view for a TV or wallboard">
                    <i class="bi bi-tv"></i> Wallboard
                </a>
                <button class="btn btn-sm btn-outline-primary" id="refresh-btn"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Application</th>
                        <th>URL</th>
                        <th>Environment</th>
                        <th>Status</th>
                        <th>Response Time</th>
                        <th>Last Checked</th>
                    </tr>
                </thead>
                <tbody id="apps-table-body">
                    <tr><td colspan="6" class="text-center text-muted py-4">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- New Application modal: just name + URL, everything else defaults on the backend -->
<div class="modal fade" id="diagnose-modal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="diagnose-title">Diagnosis</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="diagnose-body"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/dashboard.js"></script>
</body>
</html>

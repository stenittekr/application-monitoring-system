<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard - Central Monitoring & Diagnostic Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body data-page-title="Dashboard">
<div id="amns-page-content">
    <div class="card border-0 shadow-sm mb-4" id="welcome-banner">
        <div class="card-body"></div>
    </div>
    <div class="row g-3 mb-4" id="stat-cards"></div>

    <div class="row g-3 mb-4" id="app-tiles"></div>

    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <span class="fw-semibold"><i class="bi bi-hdd-network me-2"></i>Applications</span>
            <div class="d-flex gap-2">
                <button class="btn btn-sm btn-primary d-none" id="new-app-btn"><i class="bi bi-plus-lg"></i> New Application</button>
                <button class="btn btn-sm btn-outline-primary" id="refresh-btn"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Application</th>
                        <th>URL</th>
                        <th>Environment</th>
                        <th>Status</th>
                        <th>Response Time</th>
                        <th>Last Checked</th>
                    </tr>
                </thead>
                <tbody id="apps-table-body">
                    <tr><td colspan="6" class="text-center text-muted py-4">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- New Application modal: just name + URL, everything else defaults on the backend -->
<div class="modal fade" id="new-app-modal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="new-app-form">
                <div class="modal-header">
                    <h5 class="modal-title">New Application</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Application Name *</label>
                        <input class="form-control" id="new-app-name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">URL *</label>
                        <input class="form-control" id="new-app-url" placeholder="https://example.com" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/dashboard.js"></script>
</body>
</html>

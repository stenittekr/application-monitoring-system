<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Incidents - Centralized Server & Application Monitoring Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body data-page-title="Incidents">
<div id="amns-page-content">
    <div class="card border-0 shadow-sm mb-3">
        <div class="card-body">
            <div class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small text-muted">Application</label>
                    <select class="form-select form-select-sm" id="filter-application"><option value="">All</option></select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted">Status</label>
                    <select class="form-select form-select-sm" id="filter-status">
                        <option value="">All</option>
                        <option value="OPEN">Open</option>
                        <option value="RESOLVED">Resolved</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted">Environment</label>
                    <select class="form-select form-select-sm" id="filter-environment"><option value="">All</option></select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted">From</label>
                    <input type="date" class="form-control form-control-sm" id="filter-date-from">
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted">To</label>
                    <input type="date" class="form-control form-control-sm" id="filter-date-to">
                </div>
                <div class="col-md-1">
                    <button class="btn btn-sm btn-primary w-100" id="apply-filters-btn">Filter</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white fw-semibold"><i class="bi bi-exclamation-triangle me-2"></i>Incidents</div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Application/Server</th><th>Environment</th><th>Severity</th><th>Status</th><th>Started</th>
                        <th>Detected</th><th>Resolved</th><th>Duration</th><th>Reason</th>
                        <th>Notification</th><th>Acknowledged</th><th>Assigned</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody id="incidents-table-body"><tr><td colspan="12" class="text-center text-muted py-4">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="assign-modal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Assign incident</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <label class="form-label small text-muted" for="assign-user-select">Assign to</label>
                <select class="form-select" id="assign-user-select"></select>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="assign-confirm-btn">Assign</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="incident-modal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="incident-modal-title">Incident</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="incident-summary" class="mb-3"></div>

                <h6 class="text-muted small text-uppercase">Investigation notes</h6>
                <div id="incident-notes" class="mb-3"></div>
                <div class="input-group input-group-sm mb-4">
                    <input class="form-control" id="incident-note-input"
                           placeholder="What did you find, or what did you do?">
                    <button class="btn btn-outline-secondary" id="incident-note-add">Add note</button>
                </div>

                <div id="incident-resolve-panel">
                    <h6 class="text-muted small text-uppercase">Resolve</h6>
                    <div class="row g-2 align-items-end">
                        <div class="col-md-4">
                            <label class="form-label small">Cause</label>
                            <select class="form-select form-select-sm" id="incident-resolve-category">
                                <option value="">Not stated</option>
                                <option>Application fault</option>
                                <option>Dependency failure</option>
                                <option>Configuration</option>
                                <option>Network</option>
                                <option>Planned change</option>
                                <option>False alarm - monitoring</option>
                            </select>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label small">Note</label>
                            <input class="form-control form-control-sm" id="incident-resolve-note">
                        </div>
                        <div class="col-md-3 d-grid">
                            <button class="btn btn-sm btn-primary" id="incident-resolve-btn">Resolve</button>
                        </div>
                    </div>
                </div>

                <div id="incident-reopen-panel" class="d-none">
                    <h6 class="text-muted small text-uppercase">Reopen</h6>
                    <div class="input-group input-group-sm">
                        <input class="form-control" id="incident-reopen-reason"
                               placeholder="Why is this not actually fixed?">
                        <button class="btn btn-outline-danger" id="incident-reopen-btn">Reopen</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/incidents.js"></script>
</body>
</html>

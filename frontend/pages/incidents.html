<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Incidents - Central Monitoring & Diagnostic Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body data-page-title="Incidents">
<div id="amns-page-content">
    <div class="card border-0 shadow-sm mb-3">
        <div class="card-body">
            <div class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small text-muted">Application</label>
                    <select class="form-select form-select-sm" id="filter-application"><option value="">All</option></select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted">Status</label>
                    <select class="form-select form-select-sm" id="filter-status">
                        <option value="">All</option>
                        <option value="OPEN">Open</option>
                        <option value="RESOLVED">Resolved</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted">Environment</label>
                    <select class="form-select form-select-sm" id="filter-environment"><option value="">All</option></select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted">From</label>
                    <input type="date" class="form-control form-control-sm" id="filter-date-from">
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted">To</label>
                    <input type="date" class="form-control form-control-sm" id="filter-date-to">
                </div>
                <div class="col-md-1">
                    <button class="btn btn-sm btn-primary w-100" id="apply-filters-btn">Filter</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white fw-semibold"><i class="bi bi-exclamation-triangle me-2"></i>Incidents</div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Application</th><th>Environment</th><th>Status</th><th>Started</th>
                        <th>Detected</th><th>Resolved</th><th>Duration</th><th>Reason</th>
                        <th>HTTP Status</th><th>Notification</th>
                    </tr>
                </thead>
                <tbody id="incidents-table-body"><tr><td colspan="10" class="text-center text-muted py-4">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/incidents.js"></script>
</body>
</html>

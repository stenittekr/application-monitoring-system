<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Servers - Centralized Server & Application Monitoring Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body data-page-title="Servers">
<div id="amns-page-content">
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white fw-semibold d-flex justify-content-between align-items-center">
            <span><i class="bi bi-hdd-network me-2"></i>Enrolled Servers</span>
            <button class="btn btn-sm btn-outline-secondary" id="refresh-btn"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Hostname</th><th>IP Address</th><th>OS</th><th>Status</th>
                        <th>CPU</th><th>RAM</th><th>Disk</th><th>Last Heartbeat</th><th>Last Boot</th><th>Alerts</th><th>Discovered</th>
                    </tr>
                </thead>
                <tbody id="servers-table-body"><tr><td colspan="10" class="text-center text-muted py-4">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="discovery-modal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="discovery-modal-title">Discovered on server</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <ul class="nav nav-tabs" role="tablist">
                    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#discovery-services">Services</button></li>
                    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#discovery-ports">Ports</button></li>
                    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#discovery-processes">Processes</button></li>
                    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#discovery-programs">Installed Programs</button></li>
                    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#discovery-changes">Changes</button></li>
                </ul>
                <div class="tab-content pt-3">
                    <div class="tab-pane fade show active" id="discovery-services">
                        <table class="table table-sm">
                            <thead><tr><th style="width:5rem">Monitor</th><th>Name</th><th>Display Name</th><th>Status</th></tr></thead>
                            <tbody id="discovery-services-body"></tbody>
                        </table>
                    </div>
                    <div class="tab-pane fade" id="discovery-ports">
                        <table class="table table-sm">
                            <thead><tr><th>Port</th><th>Protocol</th><th>Process</th></tr></thead>
                            <tbody id="discovery-ports-body"></tbody>
                        </table>
                    </div>
                    <div class="tab-pane fade" id="discovery-processes">
                        <div class="form-check form-switch small mb-2">
                            <input class="form-check-input" type="checkbox" id="discovery-scripts-only" checked>
                            <label class="form-check-label" for="discovery-scripts-only">
                                Only scripts (Python, Node, Java, PowerShell)
                            </label>
                        </div>
                        <table class="table table-sm">
                            <thead><tr><th style="width:5rem">Monitor</th><th>Process</th><th>Script / Module</th><th>PID</th><th>User</th><th class="text-end">Memory</th></tr></thead>
                            <tbody id="discovery-processes-body"></tbody>
                        </table>
                    </div>
                    <div class="tab-pane fade" id="discovery-changes">
                        <table class="table table-sm">
                            <thead><tr><th>When</th><th>Category</th><th>Change</th><th>Item</th><th>Detail</th></tr></thead>
                            <tbody id="discovery-changes-body"></tbody>
                        </table>
                    </div>
                    <div class="tab-pane fade" id="discovery-programs">
                        <input class="form-control form-control-sm mb-2" id="discovery-programs-filter" placeholder="Filter by name or publisher...">
                        <table class="table table-sm">
                            <thead><tr><th>Program</th><th>Version</th><th>Publisher</th></tr></thead>
                            <tbody id="discovery-programs-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="modal-footer justify-content-between">
                <span class="small text-muted" id="discovery-expected-summary"></span>
                <button class="btn btn-sm btn-primary" id="discovery-save-expected">
                    Save monitored components
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/servers.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Users - Centralized Server & Application Monitoring Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body data-page-title="Users">
<div id="amns-page-content">
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <span class="fw-semibold"><i class="bi bi-people me-2"></i>Users</span>
            <div class="d-flex align-items-center gap-3">
                <span class="small text-muted" id="disabled-count"></span>
                <div class="form-check mb-0">
                    <input class="form-check-input" type="checkbox" id="show-disabled">
                    <label class="form-check-label small text-muted" for="show-disabled">Show disabled</label>
                </div>
                <button class="btn btn-sm btn-primary d-none" id="new-user-btn"><i class="bi bi-plus-lg"></i> New User</button>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Last Login</th><th>Actions</th></tr>
                </thead>
                <tbody id="users-table-body"><tr><td colspan="6" class="text-center text-muted py-4">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="user-form-modal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="user-form">
                <div class="modal-header">
                    <h5 class="modal-title" id="user-form-title">New User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="user-id">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input class="form-control" id="user-name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="user-email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Role</label>
                        <select class="form-select" id="user-role">
                            <option value="ADMIN">Platform Administrator</option>
                            <option value="IT_MANAGER">IT Manager</option>
                            <option value="APP_OWNER">Application Owner</option>
                            <option value="OPERATOR">IT Support / Operator</option>
                            <option value="AUDITOR">Auditor / Management</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" id="user-password-label">Password</label>
                        <input type="password" class="form-control" id="user-password">
                        <div class="form-text" id="user-password-hint">Leave blank to keep the current password.</div>
                    </div>
                    <div class="form-check" id="user-active-wrapper">
                        <input class="form-check-input" type="checkbox" id="user-active" checked>
                        <label class="form-check-label" for="user-active">Active</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/users.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reports - Centralized Server & Application Monitoring Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body data-page-title="Reports">
<div id="amns-page-content">
    <div class="row g-3 mb-4" id="response-metrics"></div>
    <div class="card border-0 shadow-sm mb-3">
        <div class="card-body">
            <div class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label class="form-label small text-muted">Application</label>
                    <select class="form-select form-select-sm" id="filter-application"><option value="">All</option></select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small text-muted">From</label>
                    <input type="date" class="form-control form-control-sm" id="filter-date-from">
                </div>
                <div class="col-md-3">
                    <label class="form-label small text-muted">To</label>
                    <input type="date" class="form-control form-control-sm" id="filter-date-to">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-sm btn-primary w-100" id="apply-filters-btn">Filter</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white fw-semibold d-flex justify-content-between align-items-center">
            <span><i class="bi bi-bar-chart me-2"></i>Availability Report</span>
            <button class="btn btn-sm btn-outline-secondary" id="export-btn"><i class="bi bi-file-earmark-excel"></i> Export CSV</button>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Application</th><th>Environment</th><th>Checks</th><th>Availability</th>
                        <th>Avg Response</th><th>Incidents</th><th>Avg Downtime</th><th>Total Downtime</th>
                    </tr>
                </thead>
                <tbody id="report-table-body"><tr><td colspan="8" class="text-center text-muted py-4">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/reports.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Settings - Central Monitoring & Diagnostic Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body data-page-title="Settings">
<div id="amns-page-content">
    <div class="card border-0 shadow-sm mb-3">
        <div class="card-header bg-white fw-semibold"><i class="bi bi-envelope-gear me-2"></i>Email (SMTP) Settings</div>
        <div class="card-body">
            <p class="text-muted small">
                Stored in the database, not in a config file, so it can be changed here without restarting the
                server. The password field is always shown blank for security - leave it blank to keep the current
                one, or type a new value to replace it.
            </p>
            <div id="smtp-settings-fields" class="row g-3"></div>
            <button class="btn btn-primary mt-3" id="save-smtp-btn"><i class="bi bi-save"></i> Save Email Settings</button>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/settings.js"></script>
</body>
</html>
